# Default pipeline configuration (mirrors the dataclass defaults in fabric_defect/config.py).
# Any key may be removed; missing keys fall back to the defaults.

method = "one_class"       # one_class (defect-free references) | supervised (mask-trained, strip-grouped CV)
max_test_samples = 0     # 0 = every defective strip
seed = 0

[preprocess]
median_ksize = 3          # odd, 0 disables
gaussian_ksize = 0        # odd, 0 disables
gaussian_sigma = 1.0
contrast = "clahe"        # clahe | histeq | none
clahe_clip_limit = 2.0
clahe_grid = [8, 8]
illumination_sigma = 50.0 # 0 disables illumination flattening
selvage_margin = 40

[patch]
size = 256
stride = 128
defect_min_pixels = 25

[glcm]
distances = [1, 2, 3]
angles_deg = [0.0, 45.0, 90.0, 135.0]
levels = 64
properties = ["contrast", "dissimilarity", "homogeneity", "energy", "correlation"]

[lbp]
scales = [[8, 1], [16, 2]]  # (P, R) pairs, uniform riu2

[model]
scoring = "mahalanobis"   # mahalanobis | strip_mahalanobis | hybrid | relative | ocsvm | iforest
regularization = 1e-4
k = 2.5
ocsvm_nu = 0.1
iforest_trees = 200
calibration_fraction = 0.2 # defect-free images held out per fabric to set tau
test_fraction = 0.2        # defect-free images held out per fabric as image-level negatives
reference = "per_fabric"   # per_fabric (adaptive) | global (fixed) | in_domain (+ other strips' background, CV)
folds = 5                  # in_domain cross-validation folds
image_alpha = 0.05         # image-level decision: conformal p-value <= alpha  # defect-free images held out per fabric to set tau

[refine]                  # re-scoring inside flagged 256x256 patches, coarse to fine
enabled = true
sizes = [64]               # e.g. [64, 32] for a two-level cascade; stride = size / 2
k = 2.5

[segment]
kernel_size = 5
min_area = 50

[gabor]
orientations_deg = [0.0, 45.0, 90.0, 135.0]
wavelengths = [4.0, 8.0, 16.0]   # px
bandwidth = 1.0                  # octaves
gamma = 0.5

[features]
use = ["glcm", "lbp"]            # any of glcm, lbp, gabor (gabor did not help under Mahalanobis)

[supervised]               # used when method = "supervised"
window = 16                # finest classified window side; stride = window / 2
ensemble = [32]            # extra classified window sizes; validation picks 16, 32 or their mean map
context = [32, 64, 256]    # surrounding windows whose strip-normalised features add context
folds = 5                  # outer CV folds, grouped by strip, stratified by (defective, fabric)
validation_fraction = 0.25 # of each training fold, held out to choose every threshold
negatives_per_positive = 20
min_negatives = 300        # defect-free windows sampled per strip at least
max_iter = 1000            # upper bound; early stopping picks the number of boosting rounds
early_stopping = true
n_iter_no_change = 30
learning_rate = 0.08
max_leaf_nodes = 31
pixel_stage = true         # per-pixel classifier; validation decides whether its mask is used
pixel_samples = 3000       # per strip: defect pixels, as many near-defect and as many random pixels
hough_linking = true       # validation decides whether / how Hough line linking is applied
