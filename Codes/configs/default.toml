# Default pipeline configuration (mirrors the dataclass defaults in fabric_defect/config.py).
# Any key may be removed; missing keys fall back to the defaults.

max_test_samples = 0     # 0 = every defective strip
seed = 0

[preprocess]
median_ksize = 3          # odd, 0 disables
gaussian_ksize = 0        # odd, 0 disables
gaussian_sigma = 1.0
contrast = "clahe"        # clahe | histeq | none
clahe_clip_limit = 2.0
clahe_grid = [8, 8]
illumination_sigma = 50.0 # 0 disables illumination flattening
selvage_margin = 40

[patch]
size = 256
stride = 128
defect_min_pixels = 25

[glcm]
distances = [1, 2, 3]
angles_deg = [0.0, 45.0, 90.0, 135.0]
levels = 64
properties = ["contrast", "dissimilarity", "homogeneity", "energy", "correlation"]

[lbp]
scales = [[8, 1], [16, 2]]  # (P, R) pairs, uniform riu2

[model]
scoring = "hybrid"        # hybrid | relative | mahalanobis
regularization = 1e-4
k = 2.5
calibration_fraction = 0.25  # defect-free images held out per fabric to set tau

[refine]                  # 64x64 re-scoring inside flagged 256x256 patches
enabled = false
size = 64
stride = 32
k = 2.5

[segment]
kernel_size = 5
min_area = 50

[gabor]
orientations_deg = [0.0, 45.0, 90.0, 135.0]
wavelengths = [4.0, 8.0, 16.0]   # px
bandwidth = 1.0                  # octaves
gamma = 0.5

[features]
use = ["glcm", "lbp"]            # any of glcm, lbp, gabor
